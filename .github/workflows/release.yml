name: Release

# Runs when a version tag is pushed (scripts/release.mjs makes the commit and
# the tag; the owner pushes). Tests, builds, checks that the tag, package.json,
# the built manifest and CHANGELOG.md all name the same version, then publishes
# a GitHub Release with the package, its source maps and SHA256SUMS. When a
# store's secrets all exist, it also uploads a draft to the Chrome Web Store
# and to Edge Add-ons; nothing is published in a store without a click there.
# The store secrets reach only the steps that upload (and the step that checks
# they are set), never npm ci, pip, the e2e suite or a third-party action.
# How to set the secrets: docs/release.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to create the GitHub Release
    # No job-level env: the store secrets are step-scoped, see the last three steps.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build, with bundle sizes
        # build:meta exits 1 when content.js is over 120 KB; `shell: bash` gives `-o pipefail`, so that exit status survives the pipe into tee.
        shell: bash
        run: |
          npm run build:meta | tee build.log
          { echo "### Bundle sizes (minified)"; echo; grep '^|' build.log; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/e2e/requirements.txt
      - run: pip install -r test/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end test
        run: python test/e2e/e2e.py
      - name: Keep the e2e screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-output
          path: test/e2e/output
          if-no-files-found: ignore
      - run: npm run package

      - name: Check that the tag, package.json, manifest and CHANGELOG agree
        id: version
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { firstVersion, sectionFor } from './scripts/changelog.mjs';
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const first = firstVersion(changelog);
          const seen = { tag, 'package.json': pkg, 'dist/manifest.json': manifest, 'CHANGELOG.md': first };
          console.log(seen);
          const differ = Object.entries(seen).filter(([, v]) => v !== tag);
          if (differ.length) { console.error(`versions differ: ${differ.map(([k, v]) => `${k}=${v}`).join(', ')}`); process.exit(1); }
          const notes = sectionFor(changelog, tag);
          if (!notes) { console.error(`CHANGELOG.md has no entries for ${tag}`); process.exit(1); }
          appendFileSync('release-notes.md', `${notes}\n\n---\n\nInstall: unzip and load the folder as an unpacked extension, or wait for the store listing. Verify the download with \`sha256sum -c SHA256SUMS\`. The \`-sourcemaps\` zip is for reading stack traces; it is not part of the extension.\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${tag}\n`);
          EOF

      - name: Check the package contents
        run: |
          ZIP="scenevoice-${{ steps.version.outputs.version }}.zip"
          unzip -l "$ZIP"
          if unzip -Z1 "$ZIP" | grep -E '(^|/)\.|\.map$'; then
            echo "::error::$ZIP contains dotfiles or source maps (listed above)"; exit 1
          fi
          unzip -tq "$ZIP"
      - name: Checksums
        run: |
          V="${{ steps.version.outputs.version }}"
          sha256sum "scenevoice-$V.zip" "scenevoice-$V-sourcemaps.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: SceneVoice ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            scenevoice-${{ steps.version.outputs.version }}.zip
            scenevoice-${{ steps.version.outputs.version }}-sourcemaps.zip
            SHA256SUMS

      # `secrets` cannot be read in an `if:`, so this step (the first one that sees
      # the store secrets) says which store has every secret it needs. It runs only
      # when everything before it, the GitHub Release included, succeeded.
      - name: Which store credentials exist
        id: stores
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          # The publisher id is required too: chrome-webstore-upload-cli 4.x speaks the v2 API, publishers/{publisherId}/items/{id}.
          if [ -n "$CWS_EXTENSION_ID" ] && [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ] && [ -n "$CWS_PUBLISHER_ID" ]; then
            echo "cws=true" >> "$GITHUB_OUTPUT"
          else
            echo "Chrome Web Store: not all of CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_PUBLISHER_ID are set; the upload is skipped."
          fi
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then
            echo "edge=true" >> "$GITHUB_OUTPUT"
          else
            echo "Edge Add-ons: not all of EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY are set; the upload is skipped."
          fi

      - name: Chrome Web Store (upload as draft)
        # `upload` leaves the new version as a draft; publishing is a click in the developer dashboard.
        if: steps.stores.outputs.cws == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: npx --yes chrome-webstore-upload-cli@4.0.2 upload --source "scenevoice-${{ steps.version.outputs.version }}.zip"

      - name: Edge Add-ons (upload to the draft submission)
        # `!cancelled()` so a failed Chrome Web Store upload does not skip this one; the stores check above only
        # ran (and its output is only set) when the tests, the build, the checks and the GitHub Release all succeeded.
        if: ${{ !cancelled() && steps.stores.outputs.edge == 'true' }}
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node scripts/edge-upload.mjs "scenevoice-${{ steps.version.outputs.version }}.zip"
