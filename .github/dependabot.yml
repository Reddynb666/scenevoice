# Weekly dependency updates: npm dev dependencies (the extension itself has no
# runtime dependencies), the Python packages the e2e suite and screenshots use,
# and the pinned GitHub Actions. Pull requests only; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /test/e2e
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
